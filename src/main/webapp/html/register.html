<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexJob | Register</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-container { width: 100%; max-width: 400px; padding: 2rem; }
    </style>
</head>
<body>

    <div class="glass-panel auth-container animate-fade">
        <h2 style="text-align: center; color: var(--accent);">Create Account</h2>
        <p style="text-align: center; margin-bottom: 2rem;">Join NexJob today</p>

        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="login.html" style="color: var(--text-muted);">Already have an account? Login</a>
        </div>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="../index.html" style="color: var(--text-muted); font-size: 0.9em;">&larr; Back Home</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Registering...';
            
            const res = await fetchAPI('register', 'POST', {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            btn.innerText = 'Register';
            
            if(res.status === 'success') {
                showMessage('Registration successful! Please login.', false);
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showMessage(res.message || 'Registration failed', true);
            }
        });
    </script>
</body>
</html>
