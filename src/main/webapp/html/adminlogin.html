<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexJob | Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-container { width: 100%; max-width: 400px; padding: 2rem; border-color: rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <div class="glass-panel auth-container animate-fade">
        <h2 style="text-align: center; color: var(--danger);">Admin Access</h2>
        <p style="text-align: center; margin-bottom: 2rem;">Authorized personnel only</p>

        <form id="adminForm">
            <input type="email" id="email" placeholder="Admin Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-danger" style="width: 100%;">Access Admin Panel</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="../index.html" style="color: var(--text-muted); font-size: 0.9em;">&larr; Back Home</a>
        </div>
    </div>

    <script>
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Authenticating...';
            
            const res = await fetchAPI('adminlogin', 'POST', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            btn.innerText = 'Access Admin Panel';
            
            if(res.status === 'success') {
                showMessage('Welcome, Admin', false);
                setTimeout(() => window.location.href = 'adminpanel.html', 1000);
            } else {
                showMessage(res.message || 'Access Denied', true);
            }
        });
    </script>
</body>
</html>
