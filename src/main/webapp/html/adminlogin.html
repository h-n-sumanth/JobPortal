<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexJob | Admin Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
    <style>
        body { display: grid; place-items: center; min-height: 100vh; padding: 1.5rem; }
        .auth-card { width: min(420px, 100%); padding: 2.5rem; border-color: rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <div class="glass-panel auth-card animate-fade">
        <div style="text-align:center; margin-bottom:1.8rem;">
            <h2 style="color:var(--danger); margin-bottom:0.4rem;">Company Admin Login</h2>
            <p style="font-size:0.9rem;">Sign in to publish jobs and manage candidate applications for your company.</p>
        </div>

        <form id="adminLoginForm">
            <label>Admin Email Address
                <input type="email" id="email" placeholder="admin@company.com" required>
            </label>
            <label>Password
                <input type="password" id="password" placeholder="••••••••" required>
            </label>
            <button class="btn btn-danger" type="submit" style="width:100%; margin-top:0.5rem;">Sign In to Admin Portal</button>
        </form>

        <div style="margin-top:1.5rem; text-align:center; border-top:1px solid var(--border); padding-top:1rem;">
            <p style="font-size:0.88rem;">New company admin? <a href="adminregister.html" style="color:var(--danger); font-weight:700;">Register your company account →</a></p>
            <p style="font-size:0.85rem; margin-top:0.5rem;"><a href="../index.html" style="color:var(--text-muted);">← Back to Job Portal Home</a></p>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetchAPI('adminlogin', 'POST', { email, password });
            btn.disabled = false; btn.innerText = 'Sign In to Admin Portal';

            if (res.status === 'success') {
                showMessage('Admin login successful!');
                setTimeout(() => window.location.href = 'adminpanel.html', 800);
            } else {
                showMessage(res.message || 'Invalid admin credentials', true);
            }
        });
    </script>
</body>
</html>
