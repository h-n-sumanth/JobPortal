<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexJob | Elevate Your Career</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: var(--primary-color);
            filter: blur(150px);
            opacity: 0.3;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 4rem;
            background: linear-gradient(to right, #6366f1, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content animate-fade">
            <h1>Discover Your Next <br> Great Opportunity</h1>
            <p>Connect with top companies and unlock your true potential. NexJob is the premium platform for forward-thinking professionals.</p>
            
            <div class="cta-group">
                <a href="html/login.html" class="btn">User Login</a>
                <a href="html/register.html" class="btn btn-accent">Create Account</a>
                <a href="html/adminlogin.html" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Admin Area</a>
            </div>
        </div>
    </section>

</body>
</html>
